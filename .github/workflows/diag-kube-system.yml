name: diag-kube-system
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      OMNI_ENDPOINT: https://cp.stawi.org
      OMNI_SERVICE_ACCOUNT_KEY: ${{ secrets.OMNI_SERVICE_ACCOUNT_KEY }}
      OMNI_VERSION: v1.9.3
    steps:
      - name: Tools + kubeconfig
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/omnictl.real \
            "https://github.com/siderolabs/omni/releases/download/${OMNI_VERSION}/omnictl-linux-amd64"
          chmod +x /usr/local/bin/omnictl.real
          cat > /usr/local/bin/omnictl <<'WRAP'
          #!/bin/bash
          exec /usr/local/bin/omnictl.real --insecure-skip-tls-verify "$@"
          WRAP
          chmod +x /usr/local/bin/omnictl
          curl -fsSLo /usr/local/bin/kubectl https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl
          chmod +x /usr/local/bin/kubectl
          omnictl kubeconfig --cluster stawi --service-account --user diag \
            --groups system:masters --force "$HOME/.kube/config"
      - name: Dump kube-system
        run: |
          set -euo pipefail
          echo "::group::pods"
          kubectl get pods -n kube-system -o wide
          echo "::endgroup::"
          echo "::group::coredns describe"
          for p in $(kubectl -n kube-system get pods -l k8s-app=kube-dns -o name); do
            echo "==== $p ===="
            kubectl -n kube-system describe "$p" | tail -40
          done
          echo "::endgroup::"
          echo "::group::flannel crash"
          for p in $(kubectl -n kube-system get pods -l app=flannel -o jsonpath='{range .items[?(@.status.containerStatuses[0].ready==false)]}{.metadata.name}{"\n"}{end}'); do
            echo "==== $p ===="
            kubectl -n kube-system logs "$p" -c kube-flannel --tail=30 || true
            kubectl -n kube-system describe pod "$p" | tail -25
          done
          echo "::endgroup::"
          echo "::group::events kube-system"
          kubectl -n kube-system get events --sort-by='.lastTimestamp' | tail -40
          echo "::endgroup::"
