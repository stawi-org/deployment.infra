# .github/workflows/seed-inventory.yml
name: seed-inventory
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "If true, only print what would be uploaded without syncing to R2"

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      
      - name: Install yq
        run: |
          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"
          chmod +x /usr/local/bin/yq
      
      - name: Seed inventory
        if: ${{ inputs.dry_run != 'true' }}
        env:
          R2_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          bash scripts/seed-inventory-full.sh
      
      - name: Dry run
        if: ${{ inputs.dry_run == 'true' }}
        env:
          R2_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          bash scripts/seed-inventory-full.sh --dry-run