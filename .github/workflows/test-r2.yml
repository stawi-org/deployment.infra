name: test-r2-access
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - run: |
          echo "R2_ACCOUNT_ID=$R2_ACCOUNT_ID"
          echo "ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api head-bucket --bucket cluster-tofu-state --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --region us-east-1 2>&1 || echo "HEAD_BUCKET_FAILED"
          aws s3 ls "s3://cluster-tofu-state/production/inventory/" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --region us-east-1 2>&1 || echo "LS_FAILED"
