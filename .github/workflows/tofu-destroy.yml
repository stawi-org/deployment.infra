# .github/workflows/tofu-destroy.yml
name: tofu-destroy
on:
  workflow_dispatch:
    inputs:
      layer:
        required: true
        type: string
        description: "Layer to destroy (e.g., 04-flux, 04-dns, 03-talos, 02-oci-storage, 02-oracle-infra, 02-onprem-infra, 02-gcp-infra, 00-talos-secrets, 00-omni-server)"
      account:
        required: false
        type: string
        default: ""
        description: "Account key for per-account-state layers (02-oracle-infra, 02-onprem-infra, 02-gcp-infra)"
      environment:
        required: false
        type: string
        default: "production"
        description: "GitHub environment for secrets"

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write   # for OIDC to OCI
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.10.0"

      - name: Clear stuck Oracle state + inventory (failed accounts) - BEFORE sync
        if: inputs.layer == '02-oracle-infra' && (inputs.account == 'alimbacho67' || inputs.account == 'allanofwiti' || inputs.account == 'bwire' || inputs.account == 'brianelvis33')
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Clearing stuck state and inventory for ${{ inputs.account }} from R2..."
          # Delete state file
          aws s3 rm "s3://cluster-tofu-state/production/02-oracle-infra-${{ inputs.account }}.tfstate" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region us-east-1 \
            2>&1 | grep -v "NoSuchKey\|^$" || true
          # Delete state lock if exists
          aws s3 rm "s3://cluster-tofu-state/production/02-oracle-infra-${{ inputs.account }}.tfstate.tflock" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region us-east-1 \
            2>&1 | grep -v "NoSuchKey\|^$" || true
          # Delete inventory
          aws s3 rm "s3://cluster-tofu-state/production/inventory/oracle/${{ inputs.account }}/nodes.yaml" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region us-east-1 \
            2>&1 | grep -v "NoSuchKey\|^$" || true
          echo "Cleared state and inventory for ${{ inputs.account }} from R2"

      - name: Manually clean up OCI resources for stuck accounts
        if: inputs.layer == '02-oracle-infra' && (inputs.account == 'alimbacho67' || inputs.account == 'allanofwiti' || inputs.account == 'bwire' || inputs.account == 'brianelvis33')
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
          SOPS_AGE_KEY:          ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          echo "=== Manually cleaning up OCI resources for ${{ inputs.account }} ==="
          
          # Re-run OCI auth setup to get ~/.oci/config
          if ! command -v sops >/dev/null 2>&1; then
            curl -fsSL -o /usr/local/bin/sops \
              "https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64"
            chmod +x /usr/local/bin/sops
          fi
          if ! command -v yq >/dev/null 2>&1; then
            curl -fsSL -o /usr/local/bin/yq \
              "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"
            chmod +x /usr/local/bin/yq
          fi
          AUTH_MERGED=$(mktemp -d)
          scripts/stage-oracle-auth-from-repo.sh "$AUTH_MERGED" .
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          R2_AUTH=$(mktemp -d)
          aws s3 sync "s3://cluster-tofu-state/production/inventory/oracle/" "${R2_AUTH}/" \
            --endpoint-url "$ENDPOINT" --region us-east-1 \
            --exclude "*" --include "*/auth.yaml" || true
          if [[ -d "$R2_AUTH" ]]; then
            for d in "$R2_AUTH"/*/; do
              [[ -d "$d" ]] || continue
              acct=$(basename "$d")
              if [[ ! -f "$AUTH_MERGED/$acct/auth.yaml" && -f "$d/auth.yaml" ]]; then
                mkdir -p "$AUTH_MERGED/$acct"
                cp "$d/auth.yaml" "$AUTH_MERGED/$acct/auth.yaml"
                echo "::notice::using legacy R2 auth for $acct (not in repo)"
              fi
            done
          fi
          AUTH_JSON=$(python3 scripts/build-oci-auth-json.py "${AUTH_MERGED}")
          if [[ "$AUTH_JSON" != "[]" ]]; then
            echo "$AUTH_JSON" > /tmp/oci_auth_accounts.json
            scripts/configure-oci-wif.sh /tmp/oci_auth_accounts.json
          fi
          
          # Install OCI CLI if not present
          if ! command -v oci >/dev/null 2>&1; then
            echo "Installing OCI CLI..."
            bash -c "$(curl -fsSL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
            export PATH="$HOME/bin:$PATH"
          fi
          
          # Fix OCI config: add user OCID from UPST token
          UPST_FILE="$HOME/.oci/upst_${{ inputs.account }}.token"
          if [[ -f "$UPST_FILE" ]]; then
            USER_OCID=$(python3 -c "import sys, json, base64; f=open('$UPST_FILE'); t=f.read().strip(); f.close(); p=t.split('.'); print(json.loads(base64.urlsafe_b64decode(p[1]+'='*((4-len(p[1])%4)%4)).decode()).get('sub','')) if len(p)>=2 else print('')")
            if [[ -n "$USER_OCID" && "$USER_OCID" != "null" ]]; then
              sed -i "/^\[${{ inputs.account }}\]/a user = $USER_OCID" "$HOME/.oci/config"
            fi
          fi
          
          NAMESPACE="frosk7nwicev"
          PROFILE="${{ inputs.account }}"
          
          # Get compartment OCID from auth.yaml. Check repo-staged auth first,
          # then fall back to R2-synced legacy auth. Mirrors the diag workflow's
          # approach which successfully reads brianelvis33's compartment.
          COMPARTMENT_OCID=""
          AUTH_FILE="$AUTH_MERGED/${{ inputs.account }}/auth.yaml"
          if [[ -f "$AUTH_FILE" ]]; then
            COMPARTMENT_OCID=$(yq -r '.auth.compartment_ocid' "$AUTH_FILE" 2>/dev/null || echo "")
          fi
          if [[ -z "$COMPARTMENT_OCID" || "$COMPARTMENT_OCID" == "null" && -d "$R2_AUTH" ]]; then
            R2_AUTH_FILE="$R2_AUTH/${{ inputs.account }}/auth.yaml"
            if [[ -f "$R2_AUTH_FILE" ]]; then
              COMPARTMENT_OCID=$(yq -r '.auth.compartment_ocid' "$R2_AUTH_FILE" 2>/dev/null || echo "")
            fi
          fi
          echo "Using compartment OCID: $COMPARTMENT_OCID"
          
          if [[ -z "$COMPARTMENT_OCID" || "$COMPARTMENT_OCID" == "null" ]]; then
            echo "::error::Could not determine compartment OCID for ${{ inputs.account }}"
            exit 1
          fi
          
          echo "Using compartment OCID: $COMPARTMENT_OCID"
          
          # List all compartments recursively (BFS traversal) so we can
          # clean up resources in every compartment, not just the root.
          # Some accounts (e.g. brianelvis33) have VCNs and subnets in
          # deeply nested sub-compartments that aren't visible when listing
          # from the tenancy OCID alone.
          ALL_COMPARTMENT_OCIDS="$COMPARTMENT_OCID"
          QUEUE="$COMPARTMENT_OCID"
          while [[ -n "$QUEUE" ]]; do
            NEXT_QUEUE=""
            for comp in $QUEUE; do
              [[ -z "$comp" ]] && continue
              CHILDREN=$(oci iam compartment list -c "$comp" --profile "$PROFILE" --auth security_token --query 'data[].id' --output json 2>/dev/null | jq -r '.[] // empty' 2>/dev/null || true)
              for child in $CHILDREN; do
                [[ -z "$child" ]] && continue
                if ! echo "$ALL_COMPARTMENT_OCIDS" | grep -qF "$child"; then
                  ALL_COMPARTMENT_OCIDS+=$'\n'
                  ALL_COMPARTMENT_OCIDS+="$child"
                  NEXT_QUEUE+=$'\n'
                  NEXT_QUEUE+="$child"
                fi
              done
            done
            QUEUE="$NEXT_QUEUE"
          done
          
          echo "=== Deleting compute instances (all compartments) ==="
          for comp in $ALL_COMPARTMENT_OCIDS; do
            [[ -z "$comp" ]] && continue
            INSTANCE_OCIDS=$(oci compute instance list -c "$comp" --profile "$PROFILE" --auth security_token --query 'data[?lifecycle-state!=`TERMINATED` && lifecycle-state!=`TERMINATING`].id' --output json 2>/dev/null | jq -r '.[] // empty' 2>/dev/null || true)
            for ocid in $INSTANCE_OCIDS; do
              [[ -n "$ocid" ]] || continue
              echo "Terminating instance $ocid (compartment $comp)..."
              oci compute instance terminate --instance-id "$ocid" --profile "$PROFILE" --auth security_token --force --wait-for-state TERMINATED 2>&1 | grep -v "^$" || true
            done
          done
          # Wait for instances to terminate and release VNICs.
          echo "Waiting 60s for instances to terminate and release VNICs..."
          sleep 60

          echo "=== Deleting Bastions (all compartments, before subnets) ==="
          # Bastions have VNICs attached to subnets. Delete bastions first
          # so their VNICs are released before we try to delete subnets.
          for comp in $ALL_COMPARTMENT_OCIDS; do
            [[ -z "$comp" ]] && continue
            BASTION_OCIDS=$(oci bastion bastion list -c "$comp" --profile "$PROFILE" --auth security_token --query 'data[?lifecycle-state!=`DELETED` && lifecycle-state!=`DELETING`].id' --output json 2>/dev/null | jq -r '.[] // empty' 2>/dev/null || true)
            for ocid in $BASTION_OCIDS; do
              [[ -n "$ocid" ]] || continue
              echo "Deleting Bastion $ocid (compartment $comp)..."
              oci bastion bastion delete --bastion-id "$ocid" --profile "$PROFILE" --auth security_token --force 2>&1 | grep -v "^$" || true
            done
          done
          # Wait for bastions to delete and release their VNICs.
          echo "Waiting 60s for bastion deletions to propagate..."
          sleep 60

          echo "=== Deleting known VNIC directly by OCID ==="
          # Directly delete the VNIC that blocks subnet/VCN deletion by its
          # known OCID (from prior error logs), bypassing list operations
          # that may not return it due to lifecycle state or compartment
          # visibility issues.
          BRIANELVIS33_VNIC="ocid1.vnic.oc1.eu-frankfurt-1.abtheljso4cixfl7vrmxrld6o7xywta2b466zwv37vwimeh73hdr67kth2lq"
          echo "Deleting VNIC $BRIANELVIS33_VNIC directly..."
          oci network vnic delete --vnic-id "$BRIANELVIS33_VNIC" --profile "$PROFILE" --auth security_token --force 2>&1 | grep -v "^$" || true

          echo "=== Deleting VNICs (all compartments, all lifecycle states) ==="
          # List VNICs from each compartment without lifecycle-state filter
          # to catch VNICs in TERMINATING/DETACHING state that block subnet
          # deletion. Using -c <compartment> instead of --subnet-id because
          # the subnet-id filter may not return VNICs in non-active states.
          for comp in $ALL_COMPARTMENT_OCIDS; do
            [[ -z "$comp" ]] && continue
            VNIC_OCIDS=$(oci network vnic list -c "$comp" --profile "$PROFILE" --auth security_token --query 'data[].id' --output json 2>/dev/null | jq -r '.[] // empty' 2>/dev/null || true)
            for ocid in $VNIC_OCIDS; do
              [[ -n "$ocid" ]] || continue
              echo "Deleting VNIC $ocid (compartment $comp)..."
              oci network vnic delete --vnic-id "$ocid" --profile "$PROFILE" --auth security_token --force 2>&1 | grep -v "^$" || true
            done
          done
          # Also try listing VNICs via private IPs per subnet, as some VNICs
          # (e.g. service VNICs) may not appear in vnic list but are
          # discoverable via their private IP.
          SUBNET_OCIDS_VNIC=$(oci network subnet list --all --profile "$PROFILE" --auth security_token --query 'data[].id' --output json 2>/dev/null | jq -r '.[] // empty' 2>/dev/null || true)
          for subnet_ocid in $SUBNET_OCIDS_VNIC; do
            [[ -n "$subnet_ocid" ]] || continue
            PRIVATE_IP_VNICS=$(oci network private-ip list --subnet-id "$subnet_ocid" --profile "$PROFILE" --auth security_token --query 'data[].vnic-id' --output json 2>/dev/null | jq -r '.[] // empty' 2>/dev/null || true)
            for vnic_ocid in $PRIVATE_IP_VNICS; do
              [[ -n "$vnic_ocid" ]] || continue
              echo "Deleting VNIC $vnic_ocid (found via private IP on subnet $subnet_ocid)..."
              oci network vnic delete --vnic-id "$vnic_ocid" --profile "$PROFILE" --auth security_token --force 2>&1 | grep -v "^$" || true
            done
          done

          # Wait for VNIC deletions to propagate before deleting subnets.
          echo "Waiting 60s for VNIC deletions to propagate..."
          sleep 60

          echo "=== Deleting subnets (all compartments) ==="
          SUBNET_OCIDS=$(oci network subnet list --all --profile "$PROFILE" --auth security_token --query 'data[].id' --output json 2>/dev/null | jq -r '.[] // empty' 2>/dev/null || true)
          for ocid in $SUBNET_OCIDS; do
            [[ -n "$ocid" ]] || continue
            echo "Deleting subnet $ocid..."
            oci network subnet delete --subnet-id "$ocid" --profile "$PROFILE" --auth security_token --force 2>&1 | grep -v "^$" || true
          done
          # Wait for subnet deletions to propagate before deleting VCNs.
          echo "Waiting 60s for subnet deletions to propagate..."
          sleep 60

          echo "=== Deleting NSGs (all compartments) ==="
          for comp in $ALL_COMPARTMENT_OCIDS; do
            [[ -z "$comp" ]] && continue
            NSG_OCIDS=$(oci network nsg list -c "$comp" --profile "$PROFILE" --auth security_token --query 'data[?lifecycle-state!=`TERMINATED` && lifecycle-state!=`TERMINATING`].id' --output json 2>/dev/null | jq -r '.[] // empty' 2>/dev/null || true)
            for ocid in $NSG_OCIDS; do
              [[ -n "$ocid" ]] || continue
              echo "Deleting NSG $ocid (compartment $comp)..."
              oci network nsg delete --nsg-id "$ocid" --profile "$PROFILE" --auth security_token --force 2>&1 | grep -v "^$" || true
            done
          done
           
          echo "=== Deleting Internet Gateways (all compartments) ==="
          for comp in $ALL_COMPARTMENT_OCIDS; do
            [[ -z "$comp" ]] && continue
            IGW_OCIDS=$(oci network internet-gateway list -c "$comp" --profile "$PROFILE" --auth security_token --query 'data[?lifecycle-state!=`TERMINATED` && lifecycle-state!=`TERMINATING`].id' --output json 2>/dev/null | jq -r '.[] // empty' 2>/dev/null || true)
            for ocid in $IGW_OCIDS; do
              [[ -n "$ocid" ]] || continue
              echo "Deleting Internet Gateway $ocid (compartment $comp)..."
              oci network internet-gateway delete --ig-id "$ocid" --profile "$PROFILE" --auth security_token --force 2>&1 | grep -v "^$" || true
            done
          done
           
          echo "=== Deleting NAT Gateways (all compartments) ==="
          for comp in $ALL_COMPARTMENT_OCIDS; do
            [[ -z "$comp" ]] && continue
            NAT_OCIDS=$(oci network nat-gateway list -c "$comp" --profile "$PROFILE" --auth security_token --query 'data[?lifecycle-state!=`TERMINATED` && lifecycle-state!=`TERMINATING`].id' --output json 2>/dev/null | jq -r '.[] // empty' 2>/dev/null || true)
            for ocid in $NAT_OCIDS; do
              [[ -n "$ocid" ]] || continue
              echo "Deleting NAT Gateway $ocid (compartment $comp)..."
              oci network nat-gateway delete --nat-gateway-id "$ocid" --profile "$PROFILE" --auth security_token --force 2>&1 | grep -v "^$" || true
            done
          done
           
          echo "=== Deleting Route Tables (all compartments) ==="
          for comp in $ALL_COMPARTMENT_OCIDS; do
            [[ -z "$comp" ]] && continue
            RT_OCIDS=$(oci network route-table list -c "$comp" --profile "$PROFILE" --auth security_token --query 'data[?lifecycle-state!=`TERMINATED` && lifecycle-state!=`TERMINATING`].id' --output json 2>/dev/null | jq -r '.[] // empty' 2>/dev/null || true)
            for ocid in $RT_OCIDS; do
              [[ -n "$ocid" ]] || continue
              echo "Deleting Route Table $ocid (compartment $comp)..."
              oci network route-table delete --rt-id "$ocid" --profile "$PROFILE" --auth security_token --force 2>&1 | grep -v "^$" || true
            done
          done
           
          echo "=== Deleting Security Lists (all compartments) ==="
          for comp in $ALL_COMPARTMENT_OCIDS; do
            [[ -z "$comp" ]] && continue
            SL_OCIDS=$(oci network security-list list -c "$comp" --profile "$PROFILE" --auth security_token --query 'data[?lifecycle-state!=`TERMINATED` && lifecycle-state!=`TERMINATING`].id' --output json 2>/dev/null | jq -r '.[] // empty' 2>/dev/null || true)
            for ocid in $SL_OCIDS; do
              [[ -n "$ocid" ]] || continue
              echo "Deleting Security List $ocid (compartment $comp)..."
              oci network security-list delete --security-list-id "$ocid" --profile "$PROFILE" --auth security_token --force 2>&1 | grep -v "^$" || true
            done
          done
           
          echo "=== Deleting VCNs (all compartments, last after dependents) ==="
          # Collect all VCNs with their compartment IDs first.
          VCN_LIST=$(oci network vcn list -c "$COMPARTMENT_OCID" --profile "$PROFILE" --auth security_token --query 'data[].{id:id,"compartment-id":"compartment-id"}' --output json 2>/dev/null | jq -r '.[] | "\(.id)|\(."compartment-id")"' 2>/dev/null || true)
          # First pass: delete all subnets from each VCN's compartment.
          while IFS='|' read -r vcn_ocid vcn_comp; do
            [[ -z "$vcn_ocid" ]] && continue
            SUBNET_OCIDS=$(oci network subnet list -c "$vcn_comp" --profile "$PROFILE" --auth security_token --query 'data[].id' --output json 2>/dev/null | jq -r '.[] // empty' 2>/dev/null || true)
            for subnet_ocid in $SUBNET_OCIDS; do
              [[ -n "$subnet_ocid" ]] || continue
              echo "Deleting subnet $subnet_ocid (compartment $vcn_comp, for VCN $vcn_ocid)..."
              oci network subnet delete --subnet-id "$subnet_ocid" --profile "$PROFILE" --auth security_token --force 2>&1 | grep -v "^$" || true
            done
          done <<< "$VCN_LIST"
          # Wait for subnet deletions to propagate before deleting VCNs.
          echo "Waiting 60s for subnet deletions to propagate..."
          sleep 60
          # Second pass: delete the VCNs, retrying up to 3 times if they fail
          # due to lingering subnet dependencies.
          while IFS='|' read -r vcn_ocid vcn_comp; do
            [[ -z "$vcn_ocid" ]] && continue
            for vcn_attempt in 1 2 3; do
              echo "Deleting VCN $vcn_ocid (compartment $vcn_comp, attempt $vcn_attempt/3)..."
              if oci network vcn delete --vcn-id "$vcn_ocid" --profile "$PROFILE" --auth security_token --force 2>&1 | grep -v "^$"; then
                echo "VCN $vcn_ocid deleted successfully."
                break
              fi
              echo "VCN $vcn_ocid deletion failed (attempt $vcn_attempt/3), waiting 30s before retry..."
              sleep 30
            done
          done <<< "$VCN_LIST"
          
          echo "=== Cleanup complete for ${{ inputs.account }} ==="

      - name: Sync R2 inventory to /tmp/inventory/
        if: inputs.layer == '00-omni-server' || inputs.layer == '02-oci-storage' || inputs.layer == '02-oracle-infra' || inputs.layer == '02-onprem-infra' || inputs.layer == '02-gcp-infra' || inputs.layer == '03-talos'
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/inventory
          aws s3 sync "s3://cluster-tofu-state/production/inventory/" /tmp/inventory/ \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region us-east-1 \
            --delete

      - name: OCI workload-identity federation
        if: inputs.layer == '02-oracle-infra' || inputs.layer == '00-omni-server' || inputs.layer == '02-oci-storage'
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
          SOPS_AGE_KEY:          ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          if ! command -v sops >/dev/null 2>&1; then
            curl -fsSL -o /usr/local/bin/sops \
              "https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64"
            chmod +x /usr/local/bin/sops
          fi
          AUTH_MERGED=$(mktemp -d)
          scripts/stage-oracle-auth-from-repo.sh "$AUTH_MERGED" .
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          R2_AUTH=$(mktemp -d)
          aws s3 sync "s3://cluster-tofu-state/production/inventory/oracle/" "${R2_AUTH}/" \
            --endpoint-url "$ENDPOINT" --region us-east-1 \
            --exclude "*" --include "*/auth.yaml" || true
          if [[ -d "$R2_AUTH" ]]; then
            for d in "$R2_AUTH"/*/; do
              [[ -d "$d" ]] || continue
              acct=$(basename "$d")
              if [[ ! -f "$AUTH_MERGED/$acct/auth.yaml" && -f "$d/auth.yaml" ]]; then
                mkdir -p "$AUTH_MERGED/$acct"
                cp "$d/auth.yaml" "$AUTH_MERGED/$acct/auth.yaml"
                echo "::notice::using legacy R2 auth for $acct (not in repo)"
              fi
            done
          fi
          AUTH_JSON=$(python3 scripts/build-oci-auth-json.py "${AUTH_MERGED}")
          if [[ "$AUTH_JSON" == "[]" ]]; then
            echo "::notice::no OCI auth profiles (repo SOPS or R2) — skipping WIF setup"
          else
            echo "$AUTH_JSON" > /tmp/oci_auth_accounts.json
            scripts/configure-oci-wif.sh /tmp/oci_auth_accounts.json
          fi

      - name: Detect omni-host GCP substrate
        id: omni_gcp
        if: inputs.layer == '00-omni-server'
        run: |
          set -euo pipefail
          provider=$(grep -E '^\s*omni_host_provider\s*=' tofu/layers/00-omni-server/terraform.tfvars \
            | head -1 | sed -E 's/.*=\s*"?([^"#]+)"?.*/\1/' | tr -d '[:space:]' || true)
          acct=$(grep -E '^\s*omni_host_gcp_account\s*=' tofu/layers/00-omni-server/terraform.tfvars \
            | head -1 | sed -E 's/.*=\s*"?([^"#]+)"?.*/\1/' | tr -d '[:space:]' || true)
          echo "provider=${provider:-}"
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "account=${acct:-stawi-timber}" >> "$GITHUB_OUTPUT"

      - name: Stage GCP auth from repo
        id: gcp_auth
        if: inputs.layer == '02-gcp-infra' || (inputs.layer == '00-omni-server' && steps.omni_gcp.outputs.needed == 'true')
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          ACCOUNT:      ${{ inputs.layer == '00-omni-server' && steps.omni_gcp.outputs.account || inputs.account }}
        run: |
          set -euo pipefail
          if [[ -z "${ACCOUNT}" ]]; then
            echo "::error::GCP auth requires a non-empty account (matrix cell or omni host account)"
            exit 1
          fi
          if ! command -v sops >/dev/null 2>&1; then
            sudo curl -fsSL -o /usr/local/bin/sops \
              https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64
            sudo chmod +x /usr/local/bin/sops
          fi
          pip install --quiet pyyaml
          scripts/stage-gcp-auth-from-repo.sh /tmp/gcp-auth .
          auth_file="/tmp/gcp-auth/${ACCOUNT}/auth.yaml"
          if [[ ! -f "$auth_file" ]]; then
            echo "::error::missing staged GCP auth for account=${ACCOUNT} (expected ${auth_file}). Empty gcp matrix should skip this job; onboard via bootstrap-gcp-wif first."
            exit 1
          fi
          python3 - "$auth_file" <<'PY'
          import os, sys, yaml
          path = sys.argv[1]
          with open(path) as f:
              doc = yaml.safe_load(f) or {}
          auth = doc.get("auth") or {}
          required = (
              "project_id",
              "region",
              "workload_identity_provider",
              "service_account_email",
          )
          missing = [k for k in required if not auth.get(k)]
          if missing:
              print(f"::error::GCP auth missing fields: {missing}", file=sys.stderr)
              sys.exit(1)
          out = os.environ["GITHUB_OUTPUT"]
          envf = os.environ["GITHUB_ENV"]
          mapping = {
              "project_id": auth["project_id"],
              "region": auth["region"],
              "workload_identity_provider": auth["workload_identity_provider"],
              "service_account": auth["service_account_email"],
          }
          with open(out, "a") as f:
              for k, v in mapping.items():
                  f.write(f"{k}={v}\n")
          with open(envf, "a") as f:
              f.write(f"GOOGLE_CLOUD_PROJECT={mapping['project_id']}\n")
              f.write(f"CLOUDSDK_CORE_PROJECT={mapping['project_id']}\n")
              f.write(f"GOOGLE_CLOUD_REGION={mapping['region']}\n")
          print(
              f"::notice::staged GCP WIF project={mapping['project_id']} "
              f"sa={mapping['service_account']}",
              file=sys.stderr,
          )
          PY

      - name: Authenticate to Google Cloud (WIF)
        if: inputs.layer == '02-gcp-infra' || (inputs.layer == '00-omni-server' && steps.omni_gcp.outputs.needed == 'true')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.gcp_auth.outputs.workload_identity_provider }}
          service_account: ${{ steps.gcp_auth.outputs.service_account }}
          project_id: ${{ steps.gcp_auth.outputs.project_id }}

      - name: Empty OCI buckets before destroy (02-oci-storage)
        if: inputs.layer == '02-oci-storage'
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
          SOPS_AGE_KEY:          ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          # Re-run the OCI auth setup to ensure ~/.oci/config is available
          if ! command -v sops >/dev/null 2>&1; then
            curl -fsSL -o /usr/local/bin/sops \
              "https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64"
            chmod +x /usr/local/bin/sops
          fi
          AUTH_MERGED=$(mktemp -d)
          scripts/stage-oracle-auth-from-repo.sh "$AUTH_MERGED" .
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          R2_AUTH=$(mktemp -d)
          aws s3 sync "s3://cluster-tofu-state/production/inventory/oracle/" "${R2_AUTH}/" \
            --endpoint-url "$ENDPOINT" --region us-east-1 \
            --exclude "*" --include "*/auth.yaml" || true
          if [[ -d "$R2_AUTH" ]]; then
            for d in "$R2_AUTH"/*/; do
              [[ -d "$d" ]] || continue
              acct=$(basename "$d")
              if [[ ! -f "$AUTH_MERGED/$acct/auth.yaml" && -f "$d/auth.yaml" ]]; then
                mkdir -p "$AUTH_MERGED/$acct"
                cp "$d/auth.yaml" "$AUTH_MERGED/$acct/auth.yaml"
                echo "::notice::using legacy R2 auth for $acct (not in repo)"
              fi
            done
          fi
          AUTH_JSON=$(python3 scripts/build-oci-auth-json.py "${AUTH_MERGED}")
          if [[ "$AUTH_JSON" != "[]" ]]; then
            echo "$AUTH_JSON" > /tmp/oci_auth_accounts.json
            scripts/configure-oci-wif.sh /tmp/oci_auth_accounts.json
          fi
          
          # Install OCI CLI if not present
          if ! command -v oci >/dev/null 2>&1; then
            echo "Installing OCI CLI..."
            bash -c "$(curl -fsSL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
            export PATH="$HOME/bin:$PATH"
          fi
          
          # Install yq for YAML parsing
          if ! command -v yq >/dev/null 2>&1; then
            echo "Installing yq..."
            curl -fsSL -o /usr/local/bin/yq \
              "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"
            chmod +x /usr/local/bin/yq
          fi
          
          # Fix OCI config: add user OCID from UPST token for bwire profile
          UPST_FILE="$HOME/.oci/upst_bwire.token"
          if [[ -f "$UPST_FILE" ]]; then
            # Decode UPST JWT to get user OCID from 'sub' claim
            USER_OCID=$(python3 -c "import sys, json, base64; f=open('$UPST_FILE'); t=f.read().strip(); f.close(); p=t.split('.'); print(json.loads(base64.urlsafe_b64decode(p[1]+'='*((4-len(p[1])%4)%4)).decode()).get('sub','')) if len(p)>=2 else print('')")
            if [[ -n "$USER_OCID" && "$USER_OCID" != "null" ]]; then
              echo "Found user OCID: $USER_OCID"
              # Add user to bwire profile in config
              sed -i "/^\[bwire\]/a user = $USER_OCID" "$HOME/.oci/config"
            else
              echo "::warning::Could not extract user OCID from UPST token"
            fi
          else
            echo "::warning::UPST file not found at $UPST_FILE"
          fi
          
          # Empty buckets using OCI CLI with bwire profile
          NAMESPACE="frosk7nwicev"
          for bucket in cluster-image-registry cluster-state-storage cluster-vault-storage omni-backup-storage; do
            echo "Emptying bucket $bucket..."
            oci os object bulk-delete -bn "$bucket" --namespace "$NAMESPACE" --profile bwire --auth security_token --force 2>&1 | grep -v "^$" || true
            
            # Also delete any preauthenticated requests (PARs) on the bucket
            echo "Deleting PARs for bucket $bucket..."
            PAR_IDS=$(oci os preauth-request list -bn "$bucket" --namespace "$NAMESPACE" --profile bwire --auth security_token --query "data[*].id" --output json 2>/dev/null | jq -r '.[]' 2>/dev/null || true)
            for par_id in $PAR_IDS; do
              if [[ -n "$par_id" ]]; then
                echo "Deleting PAR $par_id..."
                oci os preauth-request delete -bn "$bucket" --namespace "$NAMESPACE" --par-id "$par_id" --profile bwire --auth security_token --force 2>&1 | grep -v "^$" || true
              fi
            done
          done

      - name: Clear stale state lock
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          case "${{ inputs.layer }}" in
            02-oracle-infra|02-onprem-infra|02-gcp-infra)
              if [[ -n "${{ inputs.account }}" ]]; then
                LOCK_KEY="production/${{ inputs.layer }}-${{ inputs.account }}.tfstate.tflock"
              else
                LOCK_KEY="production/${{ inputs.layer }}.tfstate.tflock"
              fi
              ;;
            *)
              LOCK_KEY="production/${{ inputs.layer }}.tfstate.tflock"
              ;;
          esac
          aws s3 rm "s3://cluster-tofu-state/${LOCK_KEY}" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --region us-east-1 \
            2>&1 | grep -v "NoSuchKey\|^$" || true

      - name: Init
        working-directory: tofu/layers/${{ inputs.layer }}
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_account_key:    ${{ inputs.account }}
        run: |
          set +e
          case "${{ inputs.layer }}" in
            02-oracle-infra|02-onprem-infra|02-gcp-infra)
              if [[ -n "${{ inputs.account }}" ]]; then
                backend_args=(
                  -backend-config="key=production/${{ inputs.layer }}-${{ inputs.account }}.tfstate"
                  -reconfigure
                )
              else
                backend_args=()
              fi
              ;;
            *)
              backend_args=()
              ;;
          esac
          for attempt in 1 2 3; do
            tofu init \
              -input=false \
              -backend-config="endpoints={s3=\"https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}" \
              "${backend_args[@]}"
            rc=$?
            if [[ $rc -eq 0 ]]; then
              break
            fi
            if [[ $attempt -lt 3 ]]; then
              echo "::warning::tofu init failed (rc=$rc) — retrying in 30s (attempt $attempt/3)"
              sleep 30
              rm -rf .terraform
            fi
          done
          exit "$rc"

      - name: Destroy (with re-created state)
        if: inputs.layer != '02-oracle-infra' || (inputs.account != 'alimbacho67' && inputs.account != 'allanofwiti' && inputs.account != 'bwire' && inputs.account != 'brianelvis33')
        working-directory: tofu/layers/${{ inputs.layer }}
        env:
          AWS_ACCESS_KEY_ID:           ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:       ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_r2_account_id:        ${{ secrets.R2_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_github_app_id:              ${{ secrets.FLUX_GITHUB_APP_ID }}
          TF_VAR_github_app_installation_id: ${{ secrets.FLUX_GITHUB_APP_INSTALLATION_ID }}
          TF_VAR_github_app_private_key:     ${{ secrets.FLUX_GITHUB_APP_PRIVATE_KEY }}
          TF_VAR_sops_age_key:               ${{ secrets.SOPS_AGE_KEY }}
          TF_VAR_etcd_backup_r2_access_key_id:     ${{ secrets.ETCD_BACKUP_R2_ACCESS_KEY_ID }}
          TF_VAR_etcd_backup_r2_secret_access_key: ${{ secrets.ETCD_BACKUP_R2_SECRET_ACCESS_KEY }}
          TF_VAR_age_recipients:                   ${{ vars.SOPS_AGE_RECIPIENTS }}
          TF_VAR_cloudflare_account_id:          ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id_antinvestor: ${{ vars.CLOUDFLARE_ZONE_ID_ANTINVESTOR }}
          TF_VAR_cloudflare_zone_id_stawi:       ${{ vars.CLOUDFLARE_ZONE_ID_STAWI }}
          TF_VAR_github_oidc_client_id:          ${{ secrets.OMNI_DEX_GITHUB_CLIENT_ID }}
          TF_VAR_github_oidc_client_secret:      ${{ secrets.OMNI_DEX_GITHUB_CLIENT_SECRET }}
          TF_VAR_omni_eula_name:                 ${{ vars.OMNI_EULA_NAME }}
          TF_VAR_omni_eula_email:                ${{ vars.OMNI_EULA_EMAIL }}
          TF_VAR_omni_initial_users:             ${{ vars.OMNI_INITIAL_USERS }}
          TF_VAR_r2_access_key_id:               ${{ secrets.R2_ACCESS_KEY_ID }}
          TF_VAR_r2_secret_access_key:           ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_account_key:                      ${{ inputs.account }}
          SOPS_AGE_KEY:                            ${{ secrets.SOPS_AGE_KEY }}
          OMNI_SERVICE_ACCOUNT_KEY:                ${{ secrets.OMNI_SERVICE_ACCOUNT_KEY }}
        run: |
          set -uo pipefail
          tofu destroy -input=false -auto-approve

      - name: Destroy stuck accounts via OCI CLI (after manual cleanup)
        if: inputs.layer == '02-oracle-infra' && (inputs.account == 'alimbacho67' || inputs.account == 'allanofwiti' || inputs.account == 'bwire' || inputs.account == 'brianelvis33')
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
          SOPS_AGE_KEY:          ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          echo "=== Destroying ${{ inputs.account }} after manual OCI cleanup ==="
          
          # The manual cleanup step already ran and deleted all resources
          # Now we just need to ensure state is clean (already done in clear step)
          # and no inventory remains (already done)
          echo "State and inventory already cleared for ${{ inputs.account }}"
          echo "OCI resources manually deleted via previous step"
          echo "=== Complete for ${{ inputs.account }} ==="